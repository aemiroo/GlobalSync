# Give every regional server a unique, stable ID.
server-id: "region-asia"
shared-worlds:
  - "world"

# Player block edits are written to the local journal. This does not send them
# to other regions until authenticated peer transport is implemented.
capture:
  player-block-changes: true

# Networking is intentionally not enabled in this milestone.
# Do not expose a future peer transport directly to the public internet.
network:
  enabled: false
  bind-address: "127.0.0.1"
  bind-port: 28120
  shared-secret: "REPLACE_WITH_A_LONG_RANDOM_SECRET"
